<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>枚数麻雀（4・7・10枚）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Tokumin:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --u:0.9px;
  --felt:#215c50; --felt-hi:#2a6d60; --rail:#12342d; --line:rgba(255,255,255,.12);
  --ink:#f3efe2; --muted:#a8c4ba; --back:#dc8d2a; --back-hi:#f0ab4a;
  --gold:#efc04f; --gold-ink:#2b2006; --red:#c0392b;
  --panel:#fbf8ef; --panel-ink:#1f2a27; --panel-muted:#5f6e69;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --felt:#1a4b42; --felt-hi:#215a4f; --rail:#0c2621; --panel:#22332f; --panel-ink:#eef0e8; --panel-muted:#a6b7b1; }
}
:root[data-theme="dark"]{ --felt:#1a4b42; --felt-hi:#215a4f; --rail:#0c2621; --panel:#22332f; --panel-ink:#eef0e8; --panel-muted:#a6b7b1; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--rail);color:var(--ink);overflow:hidden;
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{height:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
header{width:100%;display:flex;align-items:center;gap:12px;padding:8px 14px}
header h1{margin:0;font-family:"Kaisei Tokumin",serif;font-size:20px;font-weight:800;flex:1}
.link{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--ink)}

/* ---------- tiles ---------- */
.tile{--w:18px;position:relative;display:inline-block;flex:0 0 auto;width:var(--w);height:calc(var(--w)*1.34);
  border:0;padding:0;border-radius:calc(var(--w)*.14);
  background:linear-gradient(165deg,#fffefa 0%,#f6f0e1 55%,#e8dfca 100%);
  box-shadow:inset 0 0 0 calc(var(--w)*.025) rgba(120,95,50,.22),
    0 calc(var(--w)*.07) 0 #ebe2cc,
    0 calc(var(--w)*.17) 0 var(--back),
    0 calc(var(--w)*.21) calc(var(--w)*.16) rgba(0,0,0,.45)}
.tile::before{content:"";position:absolute;inset:5% 6% 6%;background:var(--img) center/contain no-repeat}
.tile.flat{box-shadow:inset 0 0 0 calc(var(--w)*.025) rgba(120,95,50,.25),
    0 calc(var(--w)*.04) 0 #e6dcc4,0 calc(var(--w)*.1) 0 var(--back),0 calc(var(--w)*.12) calc(var(--w)*.08) rgba(0,0,0,.35)}
.tile.back{background:linear-gradient(170deg,var(--back-hi),var(--back) 70%,#b8701c);
  box-shadow:inset 0 calc(var(--w)*-.12) 0 #efe6d0,0 calc(var(--w)*.1) calc(var(--w)*.12) rgba(0,0,0,.45)}
.tile.back::before{display:none}
.tile.last::after{content:"";position:absolute;left:50%;top:calc(var(--w)*-.36);transform:translateX(-50%);
  border:calc(var(--w)*.18) solid transparent;border-top-color:var(--gold);border-bottom:0}
.tile.ronned{filter:brightness(.8) sepia(.6) saturate(3) hue-rotate(-20deg)}

/* ---------- table ---------- */
.table{position:relative;width:calc(var(--u)*400);height:calc(var(--u)*400);flex:0 0 auto;
  border-radius:calc(var(--u)*14);
  background:radial-gradient(circle at 50% 45%,var(--felt-hi),var(--felt) 70%);
  box-shadow:inset 0 0 0 calc(var(--u)*3) rgba(0,0,0,.25),inset 0 0 calc(var(--u)*40) rgba(0,0,0,.35)}
.center{position:absolute;left:calc(var(--u)*128);top:calc(var(--u)*128);width:calc(var(--u)*144);height:calc(var(--u)*144);
  background:#0f2b26;border-radius:calc(var(--u)*8);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 2px 6px rgba(0,0,0,.4);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*2)}
.center b{font-family:"Kaisei Tokumin",serif;font-size:calc(var(--u)*17);color:var(--gold)}
.center span{font-size:calc(var(--u)*11);color:var(--muted)}
.side{position:absolute;inset:0;pointer-events:none}
.plate{position:absolute;left:calc(var(--u)*128);top:calc(var(--u)*252);width:calc(var(--u)*144);height:calc(var(--u)*20);
  display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*4);font-size:calc(var(--u)*10.5);color:var(--muted);white-space:nowrap}
.plate .wd{font-family:"Kaisei Tokumin",serif;font-weight:800;color:var(--ink)}
.plate.oya .wd{color:var(--red);background:#f3efe2;border-radius:3px;padding:0 3px}
.plate.turn{color:var(--gold)}
.plate.turn::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:calc(var(--u)*2);background:var(--gold);border-radius:2px}
.river{position:absolute;left:calc(var(--u)*127.5);top:calc(var(--u)*274);width:calc(var(--u)*145);
  display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:calc(var(--u)*2) calc(var(--u)*1)}
.river .tile{--w:calc(var(--u)*28)}
.ohand{position:absolute;left:0;right:0;top:calc(var(--u)*383);display:flex;justify-content:center;align-items:flex-end;gap:calc(var(--u)*1)}
.ohand .tile{--w:calc(var(--u)*12.5)}
.ohand .gap{width:calc(var(--u)*6)}

/* ---------- my area ---------- */
.me{width:100%;flex:1 1 auto;display:flex;flex-direction:column;align-items:center;padding:14px 8px 8px;min-height:0}
.hand{display:flex;justify-content:center;align-items:flex-end;gap:3px;min-height:84px}
.hand .tile{--w:min(calc((100vw - 34px)/(var(--hn,5) + .5) - 3px),68px);min-width:38px;cursor:pointer;transition:translate .12s ease}
.hand .tile.drawn{margin-left:12px}
.hand .tile.sel{translate:0 -12px}
.hand .tile.best{outline:3px solid var(--gold);outline-offset:1px}
.hand .badge{position:absolute;top:-9px;right:-6px;z-index:2;background:var(--gold);color:var(--gold-ink);font-size:11px;font-weight:700;border-radius:999px;padding:2px 5px;line-height:1}
.hand:not(.live) .tile{cursor:default}
#msg{min-height:24px;font-size:17px;color:var(--muted);margin:14px 0 2px;text-align:center;font-weight:500}
.waits{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 12px;font-size:15px;margin-top:4px;min-height:10px}
.waits .tile{--w:20px}
.waits .w{display:inline-flex;align-items:center;gap:5px}
.waits .zero{opacity:.45}
.actions{display:flex;justify-content:center;gap:10px;min-height:44px;margin-top:8px}
.btn{border:0;border-radius:999px;padding:15px 34px;font-weight:700;font-size:20px;cursor:pointer;background:var(--gold);color:var(--gold-ink);min-height:52px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-size:14px;color:var(--muted);margin-top:14px}
.opts label{display:flex;align-items:center;gap:6px;min-height:30px}
.opts input[type=checkbox]{width:20px;height:20px}
.opts select{font-size:14px;padding:5px 6px}

/* ---------- overlay ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,20,17,.62);display:none;align-items:center;justify-content:center;padding:18px;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:10}
.overlay.show{display:flex}
.panel{background:var(--panel);color:var(--panel-ink);border-radius:18px;padding:22px 20px;width:100%;max-width:420px;max-height:100%;overflow:auto}
.panel h2{margin:0 0 6px;font-family:"Kaisei Tokumin",serif;font-size:28px}
.panel p,.panel li{font-size:16.5px;line-height:1.85}
.panel ul{padding-left:1.2em;margin:8px 0 14px}
.panel rt{font-size:11px;color:var(--panel-muted);user-select:none}
.panel rt{font-size:11px;color:var(--panel-muted);user-select:none}
.panel .sub{color:var(--panel-muted);font-size:14px;margin:0 0 12px}
.panel .btn{width:100%;margin-top:14px;font-size:20px;padding:16px 0}
.seg{display:flex;gap:8px;margin:6px 0}
.seg label{flex:1;min-width:72px}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;margin-top:12px}
.opts select{font:inherit;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:2px 4px}
.opts option{color:#1f2a27}
.seg input{position:absolute;opacity:0}
.seg span{display:block;font-size:14px;text-align:center;border:1.5px solid rgba(0,0,0,.15);border-radius:12px;padding:10px 4px;cursor:pointer;font-weight:700}
.seg input:checked+span{border-color:#1b7646;background:rgba(27,118,70,.12)}
.seg input:focus-visible+span{outline:3px solid var(--gold)}
.example{display:flex;gap:3px;align-items:flex-end;margin:6px 0 10px}
.example{gap:2px}.example .tile{--w:min(32px,calc((min(100vw,420px) - 110px)/12.5))}
.example .gap,.winhand .gap{width:8px}
.winhand{display:flex;gap:3px;justify-content:center;align-items:flex-end;margin:16px 0 20px}
.winhand{gap:2px}.winhand .tile{--w:min(46px,calc((min(100vw,420px) - 100px)/(var(--hn,5) + .6)))}
.deltas{list-style:none;padding:0;margin:0}
.deltas li{display:flex;justify-content:space-between;border-top:1px solid rgba(0,0,0,.08);padding:6px 2px}
.plus{color:#1b7646;font-weight:700}.minus{color:var(--red);font-weight:700}
@media (prefers-reduced-motion: reduce){.hand .tile{transition:none}}

<script>
const NAMES=['あなた','CPU1','CPU2','CPU3'];
const WINDS=['東','南','西','北'];
const ROT=[0,-90,180,90];            // 自家・下家・対面・上家
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);
const ty=id=>id>>2;

const S={hands:[[],[],[],[]],rivers:[[],[],[],[]],wall:[],scores:[300,300,300,300],round:0,total:4,
  n:4,dealer:0,turn:0,phase:'idle',sel:-1,tenLv:2,rec:false,twoTap:false,sound:true,autocut:false,autowin:false,ron:null,gen:0,last:null,ronned:null,reveal:-1,fresh:null};
try{const nn=localStorage.getItem('yonmai-n');if(nn!==null&&[4,7,10].includes(+nn))S.n=+nn;else if(nn==='13')S.n=10;const v=localStorage.getItem('yonmai-ten');if(v!==null)S.tenLv=+v;const r=localStorage.getItem('yonmai-rec');if(r!==null)S.rec=r==='1';
    const w=localStorage.getItem('yonmai-2tap');if(w!==null)S.twoTap=w==='1';const sd=localStorage.getItem('yonmai-sound');if(sd!==null)S.sound=sd==='1';const ac=localStorage.getItem('yonmai-autocut');if(ac!==null)S.autocut=ac==='1';const aw=localStorage.getItem('yonmai-autowin');if(aw!==null)S.autowin=aw==='1';}catch(e){}

/* ---------- size ---------- */
function fit(){
  const avail=innerHeight-44-250;
  const u=Math.max(0.62,Math.min(innerWidth-8,560,avail)/400);
  document.documentElement.style.setProperty('--u',u+'px');
}
addEventListener('resize',fit);fit();

/* ---------- logic ---------- */
function counts(h){const c=new Array(34).fill(0);h.forEach(t=>c[t]++);return c;}
function allSets(c){
  let i=0;while(i<34&&c[i]===0)i++;
  if(i>=34) return true;
  if(c[i]>=3){c[i]-=3;const ok=allSets(c);c[i]+=3;if(ok)return true;}
  if(i<27&&i%9<=6&&c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;const ok=allSets(c);c[i]++;c[i+1]++;c[i+2]++;if(ok)return true;}
  return false;
}
function isWin(types){
  if(types.length!==S.n+1) return false;
  const c=counts(types);
  for(let t=0;t<34;t++) if(c[t]>=2){c[t]-=2;const ok=allSets(c);c[t]+=2;if(ok) return true;}
  return false;
}
function waits(tn){const c=counts(tn),w=[];for(let t=0;t<34;t++) if(c[t]<4&&isWin([...tn,t])) w.push(t);return w;}
/* シャンテン数（面子M個＋雀頭）: テンパイ=0, 和了=-1 */
const SHC=new Map();
function shanten(types){
  const MM=(S.n-1)/3;
  const c=counts(types);
  const key=S.n+':'+c.join('');
  const hit=SHC.get(key);if(hit!==undefined)return hit;
  let best=99;
  (function dfs(i,m,t,p){
    while(i<34&&c[i]===0)i++;
    if(i>=34){const tt=Math.min(t,MM-m);const v=2*MM-2*m-tt-p;if(v<best)best=v;return;}
    if(c[i]>=3){c[i]-=3;dfs(i,m+1,t,p);c[i]+=3;}
    const sq=i<27&&i%9<=6;
    if(sq&&c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;dfs(i,m+1,t,p);c[i]++;c[i+1]++;c[i+2]++;}
    if(c[i]>=2){c[i]-=2;if(!p)dfs(i,m,t,1);dfs(i,m,t+1,p);c[i]+=2;}
    if(i<27&&i%9<=7&&c[i+1]){c[i]--;c[i+1]--;dfs(i,m,t+1,p);c[i]++;c[i+1]++;}
    if(sq&&c[i+2]){c[i]--;c[i+2]--;dfs(i,m,t+1,p);c[i]++;c[i+2]++;}
    c[i]--;dfs(i,m,t,p);c[i]++;
  })(0,0,0,0);
  if(SHC.size>200000)SHC.clear();
  SHC.set(key,best);
  return best;
}
/* 見えていない枚数（vis=自分が見えている手牌。河は全員分を差し引く） */
function riverCounts(){const c=new Array(34).fill(0);S.rivers.forEach(r=>r.forEach(id=>c[ty(id)]++));return c;}
function unseen(t,own,rc){
  rc=rc||riverCounts();
  let n=4-rc[t];for(const x of own)if(x===t)n--;
  return Math.max(0,n);
}
/* 有効牌：引くとシャンテン数が下がる牌の残り枚数合計 */
function ukeire(tn,sh,vis,rc){
  let n=0;const c=counts(tn);
  for(let t=0;t<34;t++){if(c[t]>=4)continue;if(shanten([...tn,t])<sh)n+=unseen(t,vis,rc);}
  return n;
}
/* 2段目の評価：有効牌を引いた後、最善の打牌をしたときの有効牌枚数の期待値（好形への変化を見る） */
function nextQuality(r,sh,vis,rc){
  if(sh<=0) return 0;
  let tot=0,wt=0;const c=counts(r);
  for(let t=0;t<34;t++){
    if(c[t]>=4)continue;
    const n=unseen(t,vis,rc);if(!n)continue;
    const h2=[...r,t];if(shanten(h2)>=sh)continue;
    let best=0;const done=new Set();
    for(let j=0;j<h2.length;j++){
      if(done.has(h2[j]))continue;done.add(h2[j]);
      const r2=h2.filter((_,k)=>k!==j);const s2=shanten(r2);
      if(s2===sh-1){const u=ukeire(r2,s2,[...vis,t],rc);if(u>best)best=u;}
    }
    tot+=n*best;wt+=n;
  }
  return wt?tot/wt:0;
}
const BDC=new Map();
function analyze(ids){
  const rc=riverCounts();
  const key=S.n+'|'+ids.join(',')+'|'+rc.join('');
  if(BDC.has(key))return BDC.get(key);
  const t=ids.map(ty);const cands=[];const seen=new Map();
  // 1段目：まずシャンテン数だけを全候補について求める（軽い）
  t.forEach((x,i)=>{
    if(seen.has(x)){ if(i===t.length-1) seen.get(x).i=i; return; } // 同じ牌ならツモ切りを優先
    const r=t.filter((_,j)=>j!==i);const sh=shanten(r);
    const c={i,x,r,sh,uke:0,next:0};
    seen.set(x,c);cands.push(c);
  });
  const minSh=Math.min(...cands.map(c=>c.sh));
  // 2段目：シャンテン数が最小の候補だけ、受け入れ枚数を計算する（重い）
  cands.forEach(c=>{if(c.sh===minSh)c.uke=ukeire(c.r,c.sh,t,rc);});
  const maxU=Math.max(...cands.filter(c=>c.sh===minSh).map(c=>c.uke));
  // 3段目：受け入れが広い候補だけ、その先の形の良さまで見る（さらに重い）
  cands.forEach(c=>{if(c.sh===minSh&&c.uke>=maxU*0.8&&c.uke>0)c.next=nextQuality(c.r,c.sh,t,rc);});
  // 最後の同点は 字牌 → 1・9牌 → 2・8牌 → 3〜7牌 の順で孤立牌を切る
  const edge=x=>{ if(x>=27) return 3; const n=x%9; if(n===0||n===8) return 2; if(n===1||n===7) return 1; return 0; };
  // 孤立牌（ペアでも前後2つ以内に仲間もない牌）は、テンパイ前なら 字牌→1,9→2,8→3〜7 の順で必ず先に切る
  const cnt=counts(t);
  const isIso=x=>{
    if(cnt[x]!==1) return false;
    if(x>=27) return true;
    const n=x%9;
    for(const d of [-2,-1,1,2]){const m=n+d;if(m>=0&&m<=8&&cnt[x+d]>0) return false;}
    return true;
  };
  cands.forEach(c=>{c.iso=isIso(c.x);});
  const isoOrder=(a,b)=>{
    if(minSh<=0||a.sh!==minSh||b.sh!==minSh) return 0;
    if(a.iso!==b.iso) return a.iso?-1:1;
    return a.iso?edge(b.x)-edge(a.x):0;
  };
  cands.sort((a,b)=>a.sh-b.sh||isoOrder(a,b)||b.uke-a.uke||b.next-a.next||edge(b.x)-edge(a.x));
  const res={best:cands[0].i,cands};
  if(BDC.size>300)BDC.clear();
  BDC.set(key,res);
  return res;
}
function bestDiscard(ids){return analyze(ids).best;}

/* ---------- flow ---------- */
function later(fn,ms){const g=S.gen;setTimeout(()=>{if(g===S.gen)fn();},ms);}
function roundName(){return `${['東','南'][Math.floor(S.round/4)%2]}${S.round%4+1}局`;}
function seatWind(s){return WINDS[(s-S.dealer+4)%4];}
const sortIds=h=>h.sort((a,b)=>a-b);

function startGame(total){S.total=total;S.round=0;S.scores=[300,300,300,300];closeOv();startHand();}
function startHand(){
  S.gen++;S.dealer=S.round%4;
  const w=[...Array(136).keys()];
  for(let i=w.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[w[i],w[j]]=[w[j],w[i]];}
  S.wall=w;S.hands=[[],[],[],[]];S.rivers=[[],[],[],[]];
  for(let k=0;k<S.n;k++)for(let s=0;s<4;s++)S.hands[(S.dealer+s)%4].push(S.wall.pop());
  S.hands.forEach(sortIds);
  Object.assign(S,{turn:S.dealer,phase:'wait',sel:-1,ron:null,last:null,ronned:null,reveal:-1,fresh:null});
  render(false);later(nextTurn,600);
}
function nextTurn(){
  if(!S.wall.length){ryukyoku();return;}
  const id=S.wall.pop();S.hands[S.turn].push(id);S.fresh=id;
  if(S.turn===0){
    S.phase='mine';S.sel=-1;
    const win4=isWin(S.hands[0].map(ty));
    if(S.autowin&&win4){const hh=S.hands[0];render();later(()=>win(0,'tsumo',null,hh[hh.length-1]),260);return;}
    if(S.autocut&&!win4){render();later(()=>discard(0,S.n),260);return;}
    render();return;
  }
  S.phase='cpu';render();
  later(()=>{
    const h=S.hands[S.turn];
    if(isWin(h.map(ty))){win(S.turn,'tsumo',null,h[h.length-1]);return;}
    discard(S.turn,bestDiscard(h));
  },700);
}
/* ---------- 打牌音（卓に牌を置く「タンッ」をWeb Audioで合成） ---------- */
let AC=null;
function primeVoices(){try{if('speechSynthesis' in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}}catch(e){}}
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function speak(text){
  if(!S.sound)return;
  try{
    if(!('speechSynthesis' in window))return;
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ja-JP';u.rate=1.05;u.pitch=1;
    const vs=speechSynthesis.getVoices();
    const jv=vs.find(v=>v.lang&&v.lang.startsWith('ja'));
    if(jv)u.voice=jv;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){}
}
function clack(seat){
  if(!S.sound)return;const ac=audio();if(!ac)return;
  const t0=ac.currentTime+0.005;const vol=seat===0?1:0.7;const p=0.92+Math.random()*0.16;
  const out=ac.createGain();out.gain.value=0.9*vol;out.connect(ac.destination);
  // 牌同士・卓に当たる硬いアタック（フィルタしたノイズ）
  const len=Math.floor(ac.sampleRate*0.07);const buf=ac.createBuffer(1,len,ac.sampleRate);const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(ac.sampleRate*0.006));
  const ns=ac.createBufferSource();ns.buffer=buf;
  const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=3200*p;bp.Q.value=0.9;
  const ng=ac.createGain();ng.gain.value=0.9;ns.connect(bp);bp.connect(ng);ng.connect(out);ns.start(t0);
  // 牌の「コッ」という胴鳴り
  [[1450,0.35,0.045],[2350,0.18,0.03]].forEach(([f,g,dur])=>{
    const o=ac.createOscillator();o.type='sine';o.frequency.setValueAtTime(f*p,t0);o.frequency.exponentialRampToValueAtTime(f*p*0.82,t0+dur);
    const og=ac.createGain();og.gain.setValueAtTime(g,t0);og.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(og);og.connect(out);o.start(t0);o.stop(t0+dur+0.02);
  });
  // 卓の低い響き
  const lo=ac.createOscillator();lo.type='sine';lo.frequency.setValueAtTime(190*p,t0);lo.frequency.exponentialRampToValueAtTime(110,t0+0.08);
  const lg=ac.createGain();lg.gain.setValueAtTime(0.45,t0);lg.gain.exponentialRampToValueAtTime(0.0001,t0+0.09);
  lo.connect(lg);lg.connect(out);lo.start(t0);lo.stop(t0+0.1);
}
function discard(seat,idx){
  clack(seat);
  const h=S.hands[seat];const id=h.splice(idx,1)[0];sortIds(h);
  S.rivers[seat].push(id);S.last=id;S.fresh=null;S.phase='wait';S.sel=-1;
  render();checkRon(seat,id,1);
}
function checkRon(from,id,k){
  for(;k<=3;k++){
    const s=(from+k)%4;
    if(isWin([...S.hands[s],id].map(ty))){
      if(s===0){S.ron={from,id,k};S.phase='ron';render();if(S.autowin){later(()=>win(0,'ron',from,id),260);}return;}
      later(()=>win(s,'ron',from,id),500);return;
    }
  }
  S.turn=(from+1)%4;render();later(nextTurn,S.turn===0?350:450);
}
function win(seat,type,from,id){
  S.phase='result';S.gen++;
  if(type==='ron') speak('ロン');
  const d=[0,0,0,0];
  if(type==='tsumo'){for(let s=0;s<4;s++)if(s!==seat){d[s]=-10;d[seat]+=10;}}
  else{d[from]=-30;d[seat]=30;S.ronned=id;}
  d.forEach((v,s)=>S.scores[s]+=v);
  S.reveal=seat;render();
  const hand=sortIds(S.hands[seat].filter(x=>x!==id));
  const who=seat===0?'あなた':NAMES[seat];
  const how=type==='tsumo'?'ツモ和了':`${from===0?'あなた':NAMES[from]}からロン和了`;
  later(()=>{},0);
  setTimeout(()=>{
    showPanel(`<h2>${type==='tsumo'?'ツモ':'ロン'}</h2>
      <p class="sub">${roundName()}　${who}の${how}</p>
      <div class="winhand" style="--hn:${S.n+1}">${hand.map(x=>tileHTML(x)).join('')}<span class="gap"></span>${tileHTML(id)}</div>
      ${deltaList(d)}
      <button class="btn" id="nextBtn">${S.round+1>=S.total?'最終結果へ':'次の局へ'}</button>`);
    $('nextBtn').onclick=endHand;
  },reduced?0:650);
}
function ryukyoku(){
  S.phase='result';S.gen++;render();
  showPanel(`<h2>流局</h2><p class="sub">${roundName()}　山（残りの牌）がなくなりました。点数の移動はありません。</p>
    ${deltaList([0,0,0,0])}
    <button class="btn" id="nextBtn">${S.round+1>=S.total?'最終結果へ':'次の局へ'}</button>`);
  $('nextBtn').onclick=endHand;
}
function deltaList(d){
  return `<ul class="deltas">${[0,1,2,3].map(s=>`<li><span>${seatWind(s)}　${NAMES[s]}</span><span>${S.scores[s]}点 ${d[s]>0?`<span class="plus">+${d[s]}</span>`:d[s]<0?`<span class="minus">${d[s]}</span>`:''}</span></li>`).join('')}</ul>`;
}
function endHand(){S.round++;if(S.round>=S.total){finalResult();return;}closeOv();startHand();}
function finalResult(){
  const order=[0,1,2,3].sort((a,b)=>S.scores[b]-S.scores[a]||a-b);
  showPanel(`<h2>対局終了</h2><p class="sub">あなたは${order.indexOf(0)+1}位でした</p>
    <ul class="deltas">${order.map((s,i)=>`<li><span>${i+1}位　${NAMES[s]}</span><span>${S.scores[s]}点</span></li>`).join('')}</ul>
    <button class="btn" id="againBtn">もう一度遊ぶ</button>`);
  $('againBtn').onclick=startScreen;
}

/* ---------- input ---------- */
$('hand').addEventListener('click',e=>{
  const b=e.target.closest('.tile');if(!b||S.phase!=='mine')return;
  const i=+b.dataset.i;
  if(!S.twoTap||S.sel===i) discard(0,i); else {S.sel=i;render(false);}
});
$('actions').addEventListener('click',e=>{
  const a=e.target.closest('button');if(!a)return;
  if(a.dataset.a==='tsumo'&&S.phase==='mine'){const h=S.hands[0];win(0,'tsumo',null,h[h.length-1]);}
  if(a.dataset.a==='ron'&&S.phase==='ron'){win(0,'ron',S.ron.from,S.ron.id);}
  if(a.dataset.a==='skip'&&S.phase==='ron'){const r=S.ron;S.ron=null;S.phase='wait';checkRon(r.from,r.id,r.k+1);}
});
function syncOpts(){$('tenSel').value=S.tenLv;$('recToggle').checked=S.rec;}
function saveOpts(){try{localStorage.setItem('yonmai-ten',S.tenLv);localStorage.setItem('yonmai-n',S.n);localStorage.setItem('yonmai-rec',S.rec?'1':'0');}catch(err){}}
syncOpts();
$('tenSel').onchange=e=>{S.tenLv=+e.target.value;saveOpts();render(false);};
$('recToggle').onchange=e=>{S.rec=e.target.checked;saveOpts();render(false);};
$('autocutToggle').checked=S.autocut;
$('autocutToggle').onchange=e=>{S.autocut=e.target.checked;try{localStorage.setItem('yonmai-autocut',S.autocut?'1':'0');}catch(err){}
  if(S.autocut&&S.phase==='mine'&&!isWin(S.hands[0].map(ty))){later(()=>discard(0,S.n),260);}render(false);};
$('autowinToggle').checked=S.autowin;
$('autowinToggle').onchange=e=>{S.autowin=e.target.checked;try{localStorage.setItem('yonmai-autowin',S.autowin?'1':'0');}catch(err){}
  if(S.autowin){
    if(S.phase==='mine'&&isWin(S.hands[0].map(ty))){const hh=S.hands[0];later(()=>win(0,'tsumo',null,hh[hh.length-1]),200);}
    else if(S.phase==='ron'){const r=S.ron;later(()=>win(0,'ron',r.from,r.id),200);}
  }
  render(false);};
$('soundToggle').checked=S.sound;
$('soundToggle').onchange=e=>{S.sound=e.target.checked;try{localStorage.setItem('yonmai-sound',S.sound?'1':'0');}catch(err){}if(S.sound){audio();clack(0);}};
$('tapToggle').checked=S.twoTap;
$('tapToggle').onchange=e=>{S.twoTap=e.target.checked;S.sel=-1;try{localStorage.setItem('yonmai-2tap',S.twoTap?'1':'0');}catch(err){}render(false);};
$('rulesBtn').onclick=()=>showRules(S.phase==='idle');

/* ---------- render ---------- */
function tileHTML(id,cls='',attrs=''){return `<span class="tile t${ty(id)} ${cls}" ${attrs}></span>`;}
function snap(){const m=new Map();document.querySelectorAll('[data-id]').forEach(el=>{const r=el.getBoundingClientRect();m.set(el.dataset.id,[r.left+r.width/2,r.top+r.height/2]);});return m;}
function flip(before){
  if(reduced||!before) return;
  document.querySelectorAll('[data-id]').forEach(el=>{
    const b=before.get(el.dataset.id);const r=el.getBoundingClientRect();
    const cx=r.left+r.width/2,cy=r.top+r.height/2;
    if(!b){
      if(el.dataset.id==String(S.fresh)){
        const a=(+el.dataset.rot||0)*Math.PI/180;
        el.animate([{transform:'translateY(-18px)',opacity:0},{transform:'none',opacity:1}],{duration:260,easing:'ease-out'});
      }
      return;
    }
    const dx=b[0]-cx,dy=b[1]-cy;if(Math.abs(dx)+Math.abs(dy)<1)return;
    const a=-(+el.dataset.rot||0)*Math.PI/180;
    const lx=dx*Math.cos(a)-dy*Math.sin(a),ly=dx*Math.sin(a)+dy*Math.cos(a);
    el.animate([{transform:`translate(${lx}px,${ly}px)`,zIndex:5},{transform:'none',zIndex:5}],{duration:320,easing:'cubic-bezier(.2,.7,.2,1)'});
  });
}
function render(anim=true){
  const before=anim?snap():null;
  $('center').innerHTML=S.phase==='idle'?'<b>${S.n}枚麻雀</b>':`<b>${roundName()}</b><span>残り ${S.wall.length}</span>`;
  for(let s=0;s<4;s++){
    const el=$('side'+s);el.style.transform=`rotate(${ROT[s]}deg)`;
    const rot=`data-rot="${ROT[s]}"`;
    const river=S.rivers[s].map(id=>tileHTML(id,'flat'+(id===S.last&&S.phase!=='result'?' last':'')+(id===S.ronned?' ronned':''),`data-id="${id}" ${rot}`)).join('');
    let oh='';
    if(s>0){
      const h=S.hands[s];const drawing=S.turn===s&&h.length===S.n+1&&S.phase!=='result';
      oh=h.map((id,i)=>{
        const face=S.reveal===s;
        const t=face?tileHTML(id,'',`data-id="${id}" ${rot}`):`<span class="tile back" data-id="${id}" ${rot}></span>`;
        return (drawing&&i===S.n?'<span class="gap"></span>':'')+t;
      }).join('');
    }
    const turnOn=S.turn===s&&(S.phase==='cpu'||S.phase==='mine');
    el.innerHTML=`<div class="plate ${S.dealer===s?'oya':''} ${turnOn?'turn':''}"><span class="wd">${seatWind(s)}</span><span>${NAMES[s]}</span><span>${S.scores[s]}</span></div>
      <div class="river">${river}</div>${s>0?`<div class="ohand">${oh}</div>`:''}`;
  }
  const h=S.hands[0];const mine=S.phase==='mine';
  let best=-1;const ten=new Set();
  let an=null;
  if(mine&&(S.rec||S.tenLv===2)&&!isWin(h.map(ty))) an=analyze(h);
  if(an&&S.rec) best=an.best;
  if(an&&S.tenLv===2){
    const zero=new Set(an.cands.filter(c=>c.sh===0).map(c=>c.x));
    h.forEach((id,i)=>{if(zero.has(ty(id)))ten.add(i);});
  }
  $('hand').className='hand'+(mine?' live':'');$('hand').style.setProperty('--hn',S.n+1);
  $('title').textContent=`${S.n}枚麻雀`;
  $('hand').innerHTML=h.map((id,i)=>{
    const cls=['tile','t'+ty(id),(mine&&i===S.n)?'drawn':'',S.sel===i?'sel':'',i===best?'best':''].join(' ');
    return `<button class="${cls}" data-id="${id}" data-i="${i}" ${mine?'':'tabindex="-1"'} aria-label="牌">${ten.has(i)?'<span class="badge">聴</span>':''}</button>`;
  }).join('');

  let msg='';
  if(mine) msg=isWin(h.map(ty))?'和了っています。ツモを宣言できます':(S.twoTap?(S.sel>=0?'もう一度タップで切ります':'切る牌を選んでください'):'切る牌をタップしてください');
  else if(S.phase==='cpu') msg=`${NAMES[S.turn]}の番です`;
  else if(S.phase==='ron') msg=`${NAMES[S.ron.from]}の捨て牌でロンできます`;
  $('msg').textContent=msg;

  let wh='';
  if(S.tenLv>0&&h.length===S.n&&S.phase!=='idle'){
    const t4=h.map(ty);const w=waits(t4);
    if(w.length&&S.tenLv===1) wh='<strong>テンパイしています</strong>';
    else if(!w.length&&S.tenLv===2) wh=`テンパイまであと${shanten(t4)}枚（${shanten(t4)}シャンテン）`;
    else if(w.length) wh='<strong>テンパイ</strong>'+(w.length===1?'（単騎待ち）':'')+'　待ち'+w.map(t=>{const n=unseen(t,t4);return `<span class="w ${n?'':'zero'}">${tileHTML(t*4)}残り${n}</span>`;}).join('');
  }
  if(an&&S.rec){const c=an.cands[0];
    const tanki=c.sh===0&&waits(c.r).length===1;
    wh=`おすすめ ${tileHTML(h[c.i])} 切り　${c.sh===0?'待ち':'有効牌'} ${c.uke}枚`+(tanki?'（単騎待ち・残りが一番多い牌を選んでいます）':'')+(S.tenLv===2&&c.sh>0?`（${c.sh}シャンテン）`:'');}
  $('waits').innerHTML=wh;
  let a='';
  if(mine&&isWin(h.map(ty))) a='<button class="btn" data-a="tsumo">ツモ</button>';
  if(S.phase==='ron') a='<button class="btn" data-a="ron">ロン</button><button class="btn ghost" data-a="skip">見送る</button>';
  $('actions').innerHTML=a;
  flip(before);
}

<p class="sub" style="margin-bottom:4px">和了の例</p>
